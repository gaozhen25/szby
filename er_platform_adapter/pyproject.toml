[project]
name = "message-adapter"
version = "0.1.0"
description = "RabbitMQ message adapters for BOSS and Douyin private messages"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["message-adapter", "rabbitmq", "boss", "douyin", "im"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "paho-mqtt>=1.6,<3.0",
    "requests>=2.31",
    "PyExecJS>=1.5",
    "ecdsa>=0.19",
    "websockets>=12.0",
    "aio-pika>=9.4,<10.0",
    "cryptography>=42.0",
    "xhshow>=0.1.0",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115,<1.0",
    "grpcio>=1.81,<2.0",
    "grpcio-tools>=1.81,<2.0",
    "protobuf>=6.33.5,<7.0",
    "pytest>=8.0",
    "ruff>=0.11.0",
    "uvicorn>=0.30,<1.0",
]
server = [
    "fastapi>=0.115,<1.0",
    "grpcio>=1.81,<2.0",
    "protobuf>=6.33.5,<7.0",
    "uvicorn>=0.30,<1.0",
]
yaml = [
    "pyyaml>=6.0",
]
browser = ["playwright>=1.40"]

[project.scripts]
adapter = "message_adapter.cli:cli"
adapter-gateway = "adapter_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["message_adapter", "adapter_gateway"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint.per-file-ignores]
"adapter_gateway/proto/*_pb2*.py" = ["E501", "F401"]
