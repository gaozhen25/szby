[project]
name = "startx-backend"
version = "0.1.0"
description = "StarX MVP backend powered by FastAPI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.4",
  "fastapi>=0.135.1",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.48",
  "pydantic>=2.12.4",
  "pydantic-settings>=2.11.0",
  "email-validator>=2.2.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.9",
  "redis>=5.3.1",
  "minio>=7.2.18",
  "oss2>=2.19.1",
  "python-multipart>=0.0.20",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "aiofiles>=23.2.1",
  "aiomysql>=0.2.0",
  "parsel>=1.9.1",
  "pyexecjs>=1.5.1",
  "playwright>=1.61.0",
  "tenacity>=8.2.2",
  "tikhub==2.1.2",
  "xhshow>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "httpx>=0.28.1",
]
cookie-sync = [
  "browser-cookie3>=0.20.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
