[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery"
version = "1.0.0"
description = "Douyin and Xiaohongshu share-link extractor for gallery.bytech.tech"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "granian>=2.3",
  "httpx>=0.27",
  "oss2>=2.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
