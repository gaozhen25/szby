# Ubuntu 宿主机 nginx 静态托管（测试服 10081 等）
# 用法：
#   1. 修改 root 为 dist 实际路径（如 /home/ubuntu/projects/qinghui-web/dist）
#   2. sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/qinghui-web
#   3. sudo ln -sf /etc/nginx/sites-available/qinghui-web /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# 构建产物须包含 postbuild 生成的 *.js.gz（pnpm run build:web:test）

server {
    listen 10081;
    server_name _;

    root /home/ubuntu/projects/qinghui-web/dist;
    index index.html;

    # 优先使用 dist 内预压缩的 .gz（entry.js 8MB+ → gzip 约 2MB）
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /_expo/static/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
