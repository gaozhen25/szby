<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书私信</title>
<style>
  :root{
    --bg:#f7f7f7; --panel:#fff; --border:#e8e8e8;
    --mine:#ff2442; --mine-text:#fff;
    --text:#222; --sub:#999; --hover:#f2f2f2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text);}
  #app{display:flex; height:100vh; max-width:1200px; margin:0 auto; box-shadow:0 0 30px rgba(0,0,0,.06);}

  /* 左侧会话列表 */
  #sidebar{width:280px; min-width:280px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column;}
  #me-top{display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--border);}
  #me-top img{width:40px; height:40px; border-radius:50%; object-fit:cover; background:#eee;}
  #me-top .info{flex:1; min-width:0;}
  #me-top .info .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #me-top .info .red{font-size:12px; color:var(--sub);}
  #chat-list{flex:1; overflow-y:auto;}
  .chat-item{display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; border-bottom:1px solid #f5f5f5;}
  .chat-item:hover{background:var(--hover);}
  .chat-item.active{background:#fff1f3;}
  .chat-item img.av{width:44px; height:44px; border-radius:50%; object-fit:cover; background:#eee; flex-shrink:0;}
  .chat-item .c-info{flex:1; min-width:0;}
  .chat-item .c-info .name{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-item .c-info .last{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .chat-item .unread{min-width:18px; height:18px; line-height:18px; border-radius:9px; background:#ff2442; color:#fff; font-size:11px; text-align:center; padding:0 5px; margin-left:auto; flex-shrink:0;}

  /* 右侧聊天区 */
  #main{flex:1; display:flex; flex-direction:column; background:var(--panel);}
  #chat-head{display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border); background:#fafafa;}
  #chat-head img{width:36px; height:36px; border-radius:50%; object-fit:cover; background:#eee;}
  #chat-head .name{font-weight:600; font-size:16px;}
  #chat-head .sub{font-size:12px; color:var(--sub);}
  #msg-list{flex:1; overflow-y:auto; padding:20px 20px 10px; background:
    radial-gradient(circle at 1px 1px, #efefef 1px, transparent 0) 0 0/20px 20px, #fff;}
  .msg{display:flex; gap:8px; margin-bottom:16px; align-items:flex-start;}
  .msg .av{width:36px; height:36px; border-radius:50%; object-fit:cover; background:#eee; flex-shrink:0;}
  .msg .body{max-width:62%; display:flex; flex-direction:column;}
  .msg .nick{font-size:12px; color:var(--sub); margin-bottom:3px;}
  .msg .bubble{position:relative; padding:9px 12px; border-radius:var(--radius); font-size:14px; line-height:1.55; word-break:break-word; white-space:pre-wrap;}
  .msg .time{font-size:11px; color:#c0c0c0; margin-top:3px;}
  .msg.them{flex-direction:row;}
  .msg.them .bubble{background:#fff; border:1px solid var(--border); border-top-left-radius:4px;}
  .msg.mine{flex-direction:row-reverse;}
  .msg.mine .nick, .msg.mine .time{text-align:right;}
  .msg.mine .bubble{background:var(--mine); color:var(--mine-text); border-top-right-radius:4px;}
  .msg.mine .nick{display:none;}
  .msg .bubble img.media{max-width:200px; max-height:240px; border-radius:10px; display:block; cursor:zoom-in; object-fit:cover;}
  .msg .bubble video.media{max-width:200px; max-height:240px; border-radius:10px; display:block;}
  .msg .bubble audio{max-width:200px; height:36px; display:block;}
  .msg .bubble .voice{display:flex; align-items:center; gap:8px; min-width:140px; cursor:pointer; user-select:none;}
  .msg .bubble .voice .bar{width:90px; height:6px; background:rgba(0,0,0,.15); border-radius:3px; position:relative; overflow:hidden;}
  .msg .bubble .voice .bar .fill{position:absolute; left:0; top:0; bottom:0; background:#ff2442; border-radius:3px; width:0%; transition:width .2s linear;}
  .msg .bubble .voice .dur{font-size:12px; color:#888;}
  .msg.mine .voice .bar{background:rgba(255,255,255,.35);}
  .msg.mine .voice .bar .fill{background:#fff;}
  .msg.mine .voice .dur{color:#ffd;}
  .msg.mine .voice{flex-direction:row-reverse;}
  .msg .revoked{color:var(--sub); font-size:13px; font-style:italic;}

  /* 输入区 */
  #input-bar{border-top:1px solid var(--border); padding:10px 16px 12px; background:#fff;}
  #emoji-row{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; max-height:0; overflow:hidden; transition:max-height .2s;}
  #emoji-row.open{max-height:80px;}
  #emoji-row button{border:none; background:none; font-size:22px; cursor:pointer; padding:2px;}
  #input-row{display:flex; align-items:flex-end; gap:10px;}
  #text-input{flex:1; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; resize:none; min-height:40px; max-height:120px; outline:none; font-family:inherit;}
  #text-input:focus{border-color:#ff5b72;}
  .btn{border:none; cursor:pointer; font-size:14px; border-radius:10px; padding:9px 18px;}
  #emoji-btn{background:#f5f5f5; padding:9px 12px;}
  #send-btn{background:var(--mine); color:#fff; font-weight:600;}
  #send-btn:disabled{opacity:.5; cursor:not-allowed;}

  .placeholder{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:100%; color:#bbb;}
  .placeholder .big{font-size:52px;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#ddd; border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="me-top">
      <img id="me-avatar" alt="me">
      <div class="info">
        <div class="name" id="me-name">…</div>
        <div class="red" id="me-red"></div>
      </div>
    </div>
    <div id="chat-list"></div>
  </aside>

  <main id="main">
    <div id="chat-head">
      <img id="peer-avatar" alt="">
      <div>
        <div class="name" id="peer-name">选择左侧会话开始聊天</div>
        <div class="sub" id="peer-sub"></div>
      </div>
    </div>
    <div id="msg-list">
      <div class="placeholder" id="empty-hint"><div class="big">💬</div><div>从左侧选择一个会话</div></div>
    </div>
    <div id="input-bar" style="display:none;">
      <div id="emoji-row">
        <button data-e="😀">😀</button><button data-e="😂">😂</button><button data-e="😍">😍</button>
        <button data-e="😭">😭</button><button data-e="😡">😡</button><button data-e="👍">👍</button>
        <button data-e="👏">👏</button><button data-e="🙏">🙏</button><button data-e="🎉">🎉</button>
        <button data-e="❤️">❤️</button><button data-e="🤔">🤔</button><button data-e="😴">😴</button>
      </div>
      <div id="input-row">
        <button class="btn" id="emoji-btn" title="表情">🙂</button>
        <textarea id="text-input" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
        <button class="btn" id="send-btn">发送</button>
      </div>
    </div>
  </main>
</div>

<script>
const state = {
  me: { user_id:"", nickname:"", avatar:"" },
  chats: [],
  current: "",          // 当前会话 chat_user_id
  msgs: new Map(),      // chat_user_id -> [{...}]
  es: null,
};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- 渲染会话列表 ----------
function renderChats(){
  const box = $("chat-list");
  box.innerHTML = "";
  if(!state.chats.length){
    box.innerHTML = '<div class="placeholder"><div>暂无会话</div></div>';
    return;
  }
  for(const ch of state.chats){
    const el = document.createElement("div");
    el.className = "chat-item" + (ch.chat_user_id===state.current ? " active":"");
    el.dataset.cid = ch.chat_user_id;
    el.innerHTML = `
      <img class="av" src="${esc(ch.avatar)}" onerror="this.style.visibility='hidden'">
      <div class="c-info">
        <div class="name">${esc(ch.nickname)}</div>
        <div class="last">${esc(ch.last_msg_content||"")}</div>
      </div>
      ${(ch.unread||0)>0 ? `<span class="unread">${(ch.unread||0)>99?"99+":ch.unread}</span>` : ""}`;
    el.onclick = () => openChat(ch.chat_user_id);
    box.appendChild(el);
  }
}

// ---------- 渲染消息 ----------
const proxy = (u, kind) => "/api/media?url=" + encodeURIComponent(u) + "&kind=" + kind;

function bubbleHTML(m){
  let html = "";
  if(m.revoked){
    html += '<div class="revoked">消息已撤回</div>';
  } else {
    const hasMedia = (m.images && m.images.length) || m.audio || m.video;
    if(m.images && m.images.length){
      for(const u of m.images){
        // 图片走后端代理：直接引用会被 CDN 按 Referer 防盗链拦截（自然宽高为 0）
        html += `<img class="media" src="${esc(proxy(u,"image"))}" loading="lazy" onclick="window.open('${esc(u)}','_blank')">`;
      }
    }
    if(m.video){
      html += `<video class="media" controls preload="metadata" src="${esc(proxy(m.video,"video"))}"></video>`;
    }
    if(m.audio){
      const dur = m.duration ? Math.round(m.duration/1000) : "";
      html += `<div class="voice"><span>🎤</span><span class="bar"><span class="fill"></span></span>
        <span class="dur">${dur?dur+"″":""}</span>
        <audio preload="none" src="${esc(proxy(m.audio,"audio"))}" type="audio/mp4"></audio></div>`;
    }
    // 媒体消息不再重复显示占位文本；纯文本（含 emoji 代码）才显示
    if(!hasMedia && m.text){
      html += esc(m.text);
    }
  }
  return html;
}

// 语音点击播放（事件委托）
document.addEventListener("click", e=>{
  const v = e.target.closest(".voice");
  if(!v) return;
  const a = v.querySelector("audio");
  const fill = v.querySelector(".fill");
  if(a.paused){
    a.play().then(()=>{
      a.ontimeupdate = ()=>{
        if(a.duration) fill.style.width = (a.currentTime / a.duration * 100) + "%";
      };
    }).catch(err=>console.error("voice play err:", err));
  } else {
    a.pause();
  }
});

function appendMessage(m, opts={}){
  const list = $("msg-list");
  const isMine = !!m.outgoing;
  const peer = state.chats.find(c=>c.chat_user_id===m.chat_user_id);
  const avatar = isMine ? state.me.avatar : (peer&&peer.avatar||"");
  const nick = isMine ? state.me.nickname : (peer&&peer.nickname||m.nickname||"");
  const el = document.createElement("div");
  el.className = "msg " + (isMine?"mine":"them");
  el.dataset.mid = m.message_id || "";
  el.innerHTML = `
    <img class="av" src="${esc(avatar)}" onerror="this.style.visibility='hidden'">
    <div class="body">
      ${isMine?"":`<div class="nick">${esc(nick)}</div>`}
      <div class="bubble">${bubbleHTML(m)}</div>
      <div class="time">${esc(m.time||"")}</div>
    </div>`;
  list.appendChild(el);
  if(!opts.scrollOff) list.scrollTop = list.scrollHeight;
  return el;
}

// ---------- 会话 upsert：新会话必须进左侧列表 ----------
function ensureChatFromMessage(m){
  const cid = String(m.chat_user_id || "");
  if(!cid) return null;
  let ch = state.chats.find(c => c.chat_user_id === cid);
  const preview = (m.text || "[图片/语音]").slice(0, 30);
  if(!ch){
    ch = {
      chat_user_id: cid,
      nickname: m.nickname || cid,
      avatar: m.avatar || "",
      last_msg_content: preview,
      last_msg_time: m.time || "",
      unread: (cid !== state.current) ? 1 : 0,
    };
    state.chats.unshift(ch);  // 新会话置顶
    return ch;
  }
  ch.last_msg_content = preview;
  if(m.nickname && (!ch.nickname || ch.nickname === cid)) ch.nickname = m.nickname;
  if(m.avatar && !ch.avatar) ch.avatar = m.avatar;
  if(cid !== state.current) ch.unread = (ch.unread || 0) + 1;
  // 有新消息的会话提到顶部
  state.chats = [ch, ...state.chats.filter(c => c.chat_user_id !== cid)];
  return ch;
}

function mergeChats(remote){
  const prev = new Map(state.chats.map(c => [c.chat_user_id, c]));
  const next = [];
  const seen = new Set();
  for(const c of (remote || [])){
    const cid = String(c.chat_user_id || "");
    if(!cid || seen.has(cid)) continue;
    seen.add(cid);
    const old = prev.get(cid);
    next.push({
      ...c,
      unread: old ? (old.unread || 0) : 0,
      // 远程可能暂时缺 preview，保留本地已有的
      last_msg_content: c.last_msg_content || (old && old.last_msg_content) || "",
    });
  }
  // 本地因实时消息临时创建、远程尚未返回的会话，继续保留在顶部
  for(const c of state.chats){
    if(!seen.has(c.chat_user_id)) next.unshift(c);
  }
  state.chats = next;
}

async function refreshChats(){
  try{
    const r = await fetch("/api/chats");
    const data = await r.json();
    mergeChats(data.chats || []);
    renderChats();
  }catch(e){ console.error("refreshChats:", e); }
}

// ---------- 消息去重 + 会话切换 ----------
function onMessage(m){
  // 归类到对应会话
  if(!state.msgs.has(m.chat_user_id)) state.msgs.set(m.chat_user_id, []);
  const arr = state.msgs.get(m.chat_user_id);
  // 按 message_id 去重：乐观插入已用服务端真实 id，与实时推送/补拉对齐；
  // 不再用「文本+时间窗」去重（会误杀用户几秒内连发的相同文本）
  if(m.message_id && arr.some(x=>x.message_id===m.message_id)) return;
  arr.push(m);
  // 新会话 / 已有会话：都必须更新左侧列表（之前只更新已有会话，新会话永远不出现）
  ensureChatFromMessage(m);
  renderChats();
  // 若正是当前会话 → 直接渲染
  if(m.chat_user_id===state.current){
    $("empty-hint") && $("empty-hint").remove();
    appendMessage(m);
  } else {
    // 非当前会话：会话条目高亮提示
    const items = document.querySelectorAll(".chat-item");
    items.forEach(it=>{ if(it.dataset.cid===m.chat_user_id) it.style.background="#fffbe6"; });
  }
}

// ---------- 打开会话 ----------
async function openChat(cid){
  state.current = cid;
  const ch = state.chats.find(c=>c.chat_user_id===cid);
  if(ch) ch.unread = 0;   // 打开会话清零未读
  renderChats();
  const peer = state.chats.find(c=>c.chat_user_id===cid);
  $("peer-name").textContent = peer ? peer.nickname : cid;
  $("peer-sub").textContent = peer ? (peer.chat_user_id) : "";
  $("peer-avatar").src = peer&&peer.avatar ? peer.avatar : "";
  $("empty-hint") && $("empty-hint").remove();
  $("input-bar").style.display = "";
  const list = $("msg-list");
  list.innerHTML = "";
  // 合并本地实时缓存 + 服务端历史，按 store_id 升序统一渲染，避免乱序/漏最新。
  // 历史（真实 id）优先加入；本地乐观插入的消息用「方向+文本+30s 时间窗」去重让位给真实版本。
  let all = [];
  const seenIds = new Set();
  const add = (m) => {
    const mid = m.message_id || "";
    if(mid && seenIds.has(mid)) return;
    if(mid) seenIds.add(mid);
    const mt = m.timestamp_ms || Date.parse(m.time) || 0;
    const dup = all.some(x => x.outgoing===m.outgoing && x.text===m.text
      && Math.abs((x.timestamp_ms || Date.parse(x.time) || 0) - mt) < 30000);
    if(dup) return;
    all.push(m);
  };
  try{
    const r = await fetch(`/api/messages?chat_user_id=${encodeURIComponent(cid)}&limit=60`);
    const data = await r.json();
    for(const m of (data.messages||[])) add(m);
  }catch(e){ console.error("history:", e); }
  if(state.msgs.has(cid)) for(const m of state.msgs.get(cid)) add(m);
  all.sort((a,b)=>{
    const sa = a.store_id||0, sb = b.store_id||0;
    if(sa && sb) return sa - sb;
    return (a.timestamp_ms||Date.parse(a.time)||0) - (b.timestamp_ms||Date.parse(b.time)||0);
  });
  for(const m of all) appendMessage(m, {scrollOff:true});
  list.scrollTop = list.scrollHeight;
}

// ---------- 发送（乐观插入：立即显示，SSE 回执按 message_id 去重） ----------
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

async function send(){
  const text = $("text-input").value.trim();
  if(!text || !state.current) return;
  $("send-btn").disabled = true;
  try{
    const r = await fetch("/api/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({to: state.current, text})
    });
    const data = await r.json();
    if(!data.ok) throw new Error(data.error||"发送失败");
    // 乐观插入：发送成功即本地渲染，不等待 WS 回执；回执到达时按 message_id 去重
    onMessage({
      chat_user_id: state.current,
      message_id: data.message_id || ("local-"+Date.now()),
      text,
      outgoing: true,
      kind: "text",
      time: data.time || nowStr(),
      timestamp_ms: Date.now()
    });
    $("text-input").value = "";
  }catch(e){
    alert("发送失败: " + e.message);
  }finally{
    $("send-btn").disabled = false;
  }
}

// ---------- SSE 实时接收（带看门狗自愈） ----------
function connectStream(){
  if(state.es) state.es.close();
  const es = new EventSource("/api/stream");
  state.es = es;
  state.lastLive = Date.now();
  es.addEventListener("message", e=>{
    state.lastLive = Date.now();
    try{ onMessage(JSON.parse(e.data)); }catch(_){}
  });
  es.addEventListener("chat", e=>{
    // 服务端发现新会话（陌生人私信）→ 立刻插入左侧列表（不增加未读，未读由 message 事件累加）
    state.lastLive = Date.now();
    try{
      const ch = JSON.parse(e.data);
      if(!ch || !ch.chat_user_id) return;
      const cid = String(ch.chat_user_id);
      let hit = state.chats.find(c => c.chat_user_id === cid);
      if(!hit){
        hit = {
          chat_user_id: cid,
          nickname: ch.nickname || cid,
          avatar: ch.avatar || "",
          last_msg_content: ch.last_msg_content || "",
          last_msg_time: ch.last_msg_time || "",
          unread: 0,
        };
        state.chats.unshift(hit);
      } else {
        if(ch.nickname) hit.nickname = ch.nickname;
        if(ch.avatar) hit.avatar = ch.avatar;
        if(ch.last_msg_content) hit.last_msg_content = ch.last_msg_content;
        // 置顶，方便看见新会话
        state.chats = [hit, ...state.chats.filter(c => c.chat_user_id !== cid)];
      }
      renderChats();
    }catch(_){}
  });
  es.addEventListener("chats", e=>{
    // 完整会话快照：合并进左侧（保留未读），用于兜底发现新会话
    state.lastLive = Date.now();
    try{
      const data = JSON.parse(e.data);
      mergeChats(data.chats || []);
      renderChats();
    }catch(_){}
  });
  es.addEventListener("ping", ()=>{ state.lastLive = Date.now(); });
  es.addEventListener("hello", e=>{
    state.lastLive = Date.now();
    try{
      const me = JSON.parse(e.data);
      if(me && me.user_id){ state.me = {...state.me, ...me}; renderMe(); }
    }catch(_){}
  });
  es.onerror = () => { state.lastLive = 0; }; // 标记失联，交给看门狗
}

// 看门狗：每 10s 检查一次，超过 30s 无任何 SSE 事件或连接已关闭 → 强制重建
setInterval(()=>{
  if(!state.es) return;
  const silent = Date.now() - (state.lastLive||0);
  const closed = state.es.readyState === EventSource.CLOSED;
  if(silent > 30000 || closed){
    console.warn("[sse] connection dead (silent=%sms closed=%s), force reconnect", silent, closed);
    try{ state.es.close(); }catch(_){}
    state.es = null;
    connectStream();
  }
}, 10000);

function renderMe(){
  $("me-name").textContent = state.me.nickname||"";
  $("me-red").textContent = state.me.red_id||"";
  if(state.me.avatar) $("me-avatar").src = state.me.avatar;
}

// ---------- 初始化 ----------
async function init(){
  try{
    const r = await fetch("/api/me");
    const me = await r.json();
    state.me = {...state.me, ...me};
  }catch(_){}
  renderMe();
  try{
    const r = await fetch("/api/chats");
    const data = await r.json();
    state.chats = (data.chats||[]).map(c=>({...c, unread:0}));
  }catch(e){ console.error("chats:", e); }
  renderChats();
  connectStream();
  // 自动打开第一个会话，打开网页即可看到最近消息
  if(state.chats.length && !state.current) openChat(state.chats[0].chat_user_id);
  // 兜底：60s 静默对一次列表（主路径是 WS/SSE 实时推送，不再 15s 轮询）
  setInterval(() => { refreshChats(); }, 60000);
  // 输入
  $("text-input").addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $("send-btn").onclick = send;
  $("emoji-btn").onclick = () => $("emoji-row").classList.toggle("open");
  document.querySelectorAll("#emoji-row button").forEach(b=>{
    b.onclick = ()=>{ $("text-input").value += b.dataset.e; $("text-input").focus(); };
  });
}
init();
</script>
</body>
</html>
