[project]
name = "kabi-boss-cli"
version = "0.3.6"
description = "A CLI for Boss Zhipin (BOSS直聘) — search jobs, chat with bosses from the terminal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "jackwener", email = "jakevingoo@gmail.com" }]
keywords = ["boss", "zhipin", "cli", "terminal", "job", "recruitment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "browser-cookie3>=0.19",
    "qrcode>=7.0",
    "paho-mqtt>=1.6,<3.0",
    "requests>=2.31",
    "PyExecJS>=1.5",
    "ecdsa>=0.19",
    "pycryptodome>=3.20",
    "websockets>=12.0",
    "websocket-client>=1.6",
    "xhshow>=0.1.0",
    "flask>=3.0",
    "waitress>=3.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]
yaml = [
    "pyyaml>=6.0",
]
browser = [
    "playwright>=1.40",
]
douyin = [
    "requests>=2.28",
    "ecdsa>=0.18",
    "PyExecJS>=1.5",
    "pycryptodome>=3.20",
]
xhs = [
    "xhshow>=0.1.0",
    "websocket-client>=1.6",
    "playwright>=1.40",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.urls]
Homepage = "https://github.com/jackwener/boss-cli"
Repository = "https://github.com/jackwener/boss-cli"
Issues = "https://github.com/jackwener/boss-cli/issues"

[project.scripts]
boss = "boss_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boss_cli"]

# 打包静态资源
[tool.hatch.build.targets.wheel.force-include]
"boss_cli/xhs_web/static" = "boss_cli/xhs_web/static"
"boss_cli/douyin_web/static" = "boss_cli/douyin_web/static"
"boss_cli/webchat/static" = "boss_cli/webchat/static"

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end tests requiring live cookies (deselect with '-m \"not smoke\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 140
